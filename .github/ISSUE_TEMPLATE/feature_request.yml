name: ✨ 功能建议
description: 提出新功能、改进想法，或认领 Roadmap 上的任务
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        想改之前先看看 [ROADMAP.md](https://github.com/AishuaiYao/AICleanBot/blob/main/ROADMAP.md)，
        避免和已有计划重复。

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 边缘 AI / 模型能力
        - 运动控制 / 传感器
        - 硬件与结构
        - 微信小程序 / 交互
        - 训练工具链
        - 工程化（CI、文档、脚本）
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述实际场景，而不是直接给方案
      placeholder: |
        现在只认引导线，遇到 T 型路口只能靠丢线停车，
        希望机器人能识别路口类型并自主选择方向。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
      description: 有思路就写，没有也行
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: 你愿意参与实现吗
      options:
        - label: 我可以提 PR
        - label: 我可以提供硬件测试
        - label: 我只能提想法
